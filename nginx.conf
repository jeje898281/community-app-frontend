server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html 不快取，確保更新後使用者馬上拿到新版（會 reference 新的 hashed assets）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # vite 產出的 hashed assets 可以長快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理到 backend service（docker compose 內網 DNS）
    # 用變數 + Docker 內建 resolver(127.0.0.11)，讓 nginx 在「請求時」才解析 backend，
    # 而非啟動時硬解析；避免 backend 尚未就緒時 nginx 因 "host not found in upstream" 直接退出。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback：所有不存在的路徑都回 index.html，讓前端 router 處理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
