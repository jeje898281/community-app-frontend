<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa7ff"/>
      <stop offset="55%" stop-color="#9d7bff"/>
      <stop offset="100%" stop-color="#ff8ab6"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Three soft petals forming an abstract bloom -->
  <g fill="url(#petal)" opacity="0.92">
    <ellipse cx="16" cy="10" rx="4" ry="7.5" transform="rotate(0 16 16)"/>
    <ellipse cx="16" cy="10" rx="4" ry="7.5" transform="rotate(120 16 16)"/>
    <ellipse cx="16" cy="10" rx="4" ry="7.5" transform="rotate(240 16 16)"/>
  </g>

  <!-- Soft white center -->
  <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
  <circle cx="16" cy="16" r="1" fill="#ffb84d"/>
</svg>
