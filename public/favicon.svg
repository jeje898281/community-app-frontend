<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b7fa6"/>
      <stop offset="100%" stop-color="#7c6fa8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Building outline -->
  <rect x="7" y="10" width="18" height="15" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Roof -->
  <polyline points="5,11 16,4 27,11" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="13" y="18" width="6" height="7" rx="1" fill="white" opacity="0.9"/>
  <!-- Left window -->
  <rect x="9" y="13" width="4" height="3" rx="0.5" fill="white" opacity="0.7"/>
  <!-- Right window -->
  <rect x="19" y="13" width="4" height="3" rx="0.5" fill="white" opacity="0.7"/>
</svg>
